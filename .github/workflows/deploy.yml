name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase Config from Secrets
        run: |
          # Create index.html from template by replacing placeholders with secrets
          sed -e "s/\${FIREBASE_API_KEY}/${{ secrets.FIREBASE_API_KEY }}/g" \
              -e "s/\${FIREBASE_AUTH_DOMAIN}/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" \
              -e "s|\${FIREBASE_DATABASE_URL}|${{ secrets.FIREBASE_DATABASE_URL }}|g" \
              -e "s/\${FIREBASE_PROJECT_ID}/${{ secrets.FIREBASE_PROJECT_ID }}/g" \
              -e "s/\${FIREBASE_STORAGE_BUCKET}/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" \
              -e "s/\${FIREBASE_MESSAGING_SENDER_ID}/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" \
              -e "s/\${FIREBASE_APP_ID}/${{ secrets.FIREBASE_APP_ID }}/g" \
              -e "s/\${FIREBASE_MEASUREMENT_ID}/${{ secrets.FIREBASE_MEASUREMENT_ID }}/g" \
              index.template.html > index.html

          echo "✅ Firebase config injected into index.html"

      - name: Verify config injection
        run: |
          # Check if placeholders were replaced (should not contain ${)
          if grep -q '\${FIREBASE' index.html; then
            echo "❌ ERROR: Some placeholders were not replaced!"
            echo "Make sure all GitHub Secrets are configured."
            exit 1
          fi
          echo "✅ All placeholders successfully replaced"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
